name: publicar
on:
  push:
    branches: [release-assets]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unir archivos
        run: |
          F=$(sed -n 2p rel/meta)
          cat rel/apk.part* > "$F"
          echo "$(cat rel/sha256)  $F" | sha256sum -c -
          P=$(sed -n 4p rel/meta)
          if [ -n "$P" ]; then
            cat rel/pc.part* > "$P"
            echo "$(cat rel/sha256_pc)  $P" | sha256sum -c -
          fi
          Q=$(sed -n 5p rel/meta)
          if [ -n "$Q" ]; then
            cat rel/quest.part* > "$Q"
            echo "$(cat rel/sha256_quest)  $Q" | sha256sum -c -
          fi
          B=$(sed -n 6p rel/meta)
          if [ -n "$B" ]; then
            cat rel/bt.part* > "$B"
            echo "$(cat rel/sha256_bt)  $B" | sha256sum -c -
          fi
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 1p rel/meta)
          F=$(sed -n 2p rel/meta)
          T=$(sed -n 3p rel/meta)
          P=$(sed -n 4p rel/meta)
          Q=$(sed -n 5p rel/meta)
          B=$(sed -n 6p rel/meta)
          BL=$(sed -n 7p rel/meta)
          EX=()
          if [ -n "$B" ]; then EX+=("$B#$BL"); fi
          gh release create "$V" "$F" $P $Q "${EX[@]}" --repo "$GITHUB_REPOSITORY" --target main --title "$T" --notes-file rel/notes.md --latest
