name: publicar
on:
  push:
    branches: [release-assets]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unir APK
        run: |
          cat rel/apk.part* > ProjectBackfire-v0.24.0-prealpha.apk
          echo "$(cat rel/sha256)  ProjectBackfire-v0.24.0-prealpha.apk" | sha256sum -c -
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.24.0-prealpha ProjectBackfire-v0.24.0-prealpha.apk --repo "$GITHUB_REPOSITORY" --target main --title "BACKFIRE v0.24.0 · pre-alpha" --notes-file rel/notes.md --latest
